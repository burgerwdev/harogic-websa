[package]
name = "websa-channelizer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
parking_lot = "0.12"
rustfft = "6.4.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
subtle = "2.6.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }
websa-dsp = { path = "../dsp/core" }
df = { package = "deep_filter", path = "../dsp/deepfilter", default-features = false, features = ["tract"] }
ndarray = "0.15"

[features]
bench-instrument = []

[dev-dependencies]
tokio-tungstenite = "0.29"

[build-dependencies]
cc = "1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
