[project]
name = "harogic-websa-tools"
version = "1.12.16"
description = "Harogic WebSA SDK bench, fixture generators and numerical reference tools (Rust service version source)"
license = "LicenseRef-Harogic-WebSA"
license-files = ["LICENSE", "LICENSE-EXCEPTION", "LICENSE-PACKAGE", "LICENSING.md", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "jsonschema>=4.23,<5"]
hardware = ["pyserial>=3.5"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "S112", "C408", "UP031", "SIM102", "SIM105", "E501", "E702"]
select = ["E", "F", "W", "UP", "B", "SIM", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
