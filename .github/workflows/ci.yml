name: CI

# Hardware-free gates cover frontend rendering and parameter state against the fake backend.
# Analyzer checks run separately on the hardware bench.
# Official actions use Node 24 (runner >= 2.327.1); project language versions stay explicit below.


on:
  push:
    branches: [master, websa-pfb-ddc, 'feat/**', 'feature/**', 'refactor/**', 'analysis/**']
  pull_request:
  workflow_dispatch:

jobs:
  soapy-patch:
    # Patch applicability needs public driver sources only, with no vendor SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SDK-free patch check dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y curl patch
      - name: Shell syntax and pinned SoapyHarogic patch
        run: make soapy-check-patch

  native:
    # Native DSP uses hosted FDK AAC. Device SDK calls remain outside this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Upstream v2.0.3 tag resolves to this commit; Ubuntu 24.04 ships only 2.0.2.
      # Source: https://github.com/mstorsjo/fdk-aac/releases/tag/v2.0.3
      - &install-fdk
        name: Build and install FDK AAC 2.0.3
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y cmake g++ git pkg-config libusb-1.0-0-dev ffmpeg
          source_dir="$(mktemp -d)"
          trap 'rm -rf -- "$source_dir"' EXIT
          git -C "$source_dir" init
          git -C "$source_dir" remote add origin https://github.com/mstorsjo/fdk-aac.git
          git -C "$source_dir" fetch --depth 1 origin 716f4394641d53f0d79c9ddac3fa93b03a49f278
          git -C "$source_dir" checkout --detach FETCH_HEAD
          cmake -S "$source_dir" -B "$source_dir/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON
          cmake --build "$source_dir/build" --parallel 2
          sudo cmake --install "$source_dir/build"
          sudo ldconfig
          pkg-config --atleast-version=2.0.3 fdk-aac
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dsp/core
      - name: Rust DSP kernel tests
        run: cargo test --release -j 1 --manifest-path dsp/core/Cargo.toml -- --test-threads=1
      - name: Rust service contract tests
        run: |
          cargo test --release -j 1 --manifest-path backend/Cargo.toml --lib --bins --tests -- --test-threads=1

  python-tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - *install-fdk
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c requirements-lock.txt
      # The vendor SDK is not installed in CI; the binding layer must import without it.
      - name: Python static checks
        run: python -m ruff check tests tools
      - name: Version is single-sourced
        run: python tools/checks/sync_version.py --check
      - name: FT8 fixture matches its encoder
        # The FT8 waveform and the message it carries are generated by this script; the Rust
        # decoder and the browser test both assume those bytes.
        run: python tools/fixtures/gen_ft8_fixtures.py --check
      - name: SSTV mode table still matches the vendored Rust tables
        # The Python transmitter's timing comes out of the Rust tree by this script; without the gate
        # an edit on either side would let the two describe different protocols.
        run: python tools/fixtures/port_sstv_modes.py --check
      - name: SSTV fixture matches its encoder
        # The Robot 36 waveform and the picture it carries are generated here; the Rust decoder test
        # and the browser wrapper test both decode these bytes.
        run: python tools/fixtures/gen_sstv_fixtures.py --check
      - name: DOM id contract (every id read from TS exists in index.html)
        run: python tools/checks/check_dom_ids.py
      - name: Every path named in the architecture docs exists
        # The stage map is the architecture's contract; without this it can name modules that were
        # renamed or never written (it did, which is how the objection was raised).
        run: python tools/checks/check_doc_paths.py
      - name: Bilingual docs keep the same section structure
        run: python tools/checks/check_docs_parity.py
      - name: Every module-scope registration is reachable from the entry point
        run: python tools/checks/check_registrations.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build native service for lifecycle tests
        run: cargo build -j 1 --release --manifest-path backend/Cargo.toml --bin websad
      - name: Tests
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Tests (includes i18n parity and the frame decoder contract)
        run: npm test
      - name: Build
        run: npm run build

  ui-smoke:
    # Real-browser checks supplement jsdom behavior tests with canvas pixels and real clicks.
    # It runs against the fake backend, so it needs neither the analyzer nor libhtraapi.
    runs-on: ubuntu-latest
    env:
      WEBSA_PORT: '8099'
      WEBSA_INSTANCE: ci-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - *install-fdk
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt -c requirements-lock.txt
          python -m playwright install --with-deps chromium
      - name: Build the frontend (the service serves dist/)
        run: cd frontend && npm ci && npm run build
      - name: Build native fixture service
        run: cargo build -j 1 --release --manifest-path backend/Cargo.toml --bin websad
      - name: Start the fake-backend service
        id: start-fake
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/websa-ci-runtime"
          printf 'XDG_RUNTIME_DIR=%s\n' "$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          ./run.sh --fake
      - name: UI smoke - rendering and wiring (fake backend)
        run: python tools/e2e/ui_smoke.py --url http://127.0.0.1:8099
      - name: Parameter state-machine contract (fake backend)
        # The same script as the bench run: it is device-agnostic by construction, so the
        # historical slot/pending/hand-off/preset regressions are now gated in CI too.
        run: python tools/e2e/state_regression.py --url http://127.0.0.1:8099
      - name: Appearance themes, shared opacity and popout synchronization (isolated fixture service)
        run: python tools/e2e/themes.py --artifacts "$RUNNER_TEMP/themes"
      - name: Channel workbench transitions and audio controls (isolated fixture service)
        run: python tools/e2e/multichannel_audio_settings.py --artifacts "$RUNNER_TEMP/multichannel-audio-settings"
      - name: Native recording formats, downloads and saved preferences (isolated fixture service)
        run: python tools/e2e/native_audio_formats.py --artifacts "$RUNNER_TEMP/native-audio-formats"
      - name: Workbench layout, frequency history and search (synthetic snapshots)
        run: |
          (cd frontend && exec node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5186 --strictPort) > "$RUNNER_TEMP/workbench-vite.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do
            if curl --fail --silent http://127.0.0.1:5186/static/dist/workbench.html > /dev/null; then break; fi
            kill -0 "$preview_pid"
            sleep 0.2
          done
          python tools/e2e/workbench_polish.py --artifacts "$RUNNER_TEMP/workbench-polish"
      - name: Stop the owned fake-backend service
        id: stop-fake
        if: always() && steps.start-fake.outcome != 'skipped'
        run: |
          if [[ -n "${XDG_RUNTIME_DIR:-}" && -d "$XDG_RUNTIME_DIR" ]]; then ./stop.sh; fi
      - name: Service log on failure
        if: failure() && steps.start-fake.outcome != 'skipped'
        run: |
          if [[ -n "${XDG_RUNTIME_DIR:-}" && -d "$XDG_RUNTIME_DIR" ]]; then
            source ./lifecycle.sh
            lifecycle_init
            if [[ -f "$LOG" ]]; then tail -n 50 "$LOG"; fi
          fi
      - name: Remove fake-backend temporary state
        if: always() && steps.stop-fake.outcome == 'success'
        # Print failure diagnostics first; retain ownership metadata if stopping failed.
        run: |
          if [[ -n "${XDG_RUNTIME_DIR:-}" ]]; then rm -rf -- "$XDG_RUNTIME_DIR"; fi

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Frontend module cycle guard
        run: python tools/checks/architecture_guard.py
