# DRM bench transmitter configuration — IQ output for the PlutoSDR bench loop.
#
#     decdrm tx tools/drm_bench/station_iq.toml --output ~/drm-bench/drm_iq.wav --duration 60
#     python3 tools/pluto_drm_tx.py --iq ~/drm-bench/drm_iq.wav --lo 400e6
#
# The signal shape matches the verified fixture `tests/fixtures/drm/` (mode B, 10 kHz,
# 64-QAM MSC, AAC + SBR mono), so a lock on the bench and a lock on the fixture are the
# same receiver state. Run the generator from the DecDRM checkout (see the DRM bench
# section of docs/en/ARCHITECTURE.md).

[channel]
mode = "B"
occupancy = 3
msc_mode = "64-QAM"
sdc_mode = "16-QAM"
interleaving = "long"
protection_b = 1
protection_a = 0

[output]
file = "drm_iq.wav"
sample_format = "int16"      # Dream and the Pluto transmitter both take 16-bit IQ
format = "iq"                # 2 channels, I on the left
level_dbfs = -15
band_limit = true

[[service]]
id = 0x123456               # the fixture's service id, so the two signals compare directly
label = "SAN90 DRM BENCH"   # SDC type 1 station label
language = "English"
iso_language = "eng"
iso_country = "gb"
programme_type = "Pop Music"

[service.audio]
codec = "he-aac"             # AAC core plus SBR: the coding the wasm receiver decodes
core_rate = 12000            # 24 kHz output, 5 frames per 400 ms
stereo = false
text = ["DRM bench loop", "SAN-90 + PlutoSDR"]

[service.audio.input]
tone_hz = 1000.0             # built-in test tone: no audio file needed
level_dbfs = -12
